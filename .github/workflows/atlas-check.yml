name: Calibrated geometry atlas self-check
on:
  push:
    branches: ['exp/geometry-atlas']
jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r experiments/atlas/requirements.txt
      - run: python experiments/atlas/make_fixture.py --size 192
      - run: python experiments/atlas/check_consistency.py
      - name: Confirm quantified channel agreement
        run: |
          python - <<'PY'
          import json
          p=json.load(open('runs/atlas-fixture/consistency.json'))
          assert p['mean_angular_disagreement_deg'] < 2.0
          assert p['p95_angular_disagreement_deg'] < 4.0
          print(p)
          PY
